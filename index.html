<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paexskin Games Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdeef0;--card:#fff;--ink:#2a0f26;--mute:#7d5f77;--line:#f0d3d9;--blue:#3347ff;--gold:#f5b82e;--silver:#c3c7d4;--bronze:#d98a5b;
--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1c0f1d;--card:#2a1829;--ink:#fdeef0;--mute:#b99cb3;--line:#40283e;--blue:#7b8bff}}
*{box-sizing:border-box;margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;font:800 28px/1 var(--display);letter-spacing:-.03em}
.mark{width:40px;height:40px;border-radius:50% 50% 50% 8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:22px}
.brand small{display:block;font:500 14px var(--body);letter-spacing:0;color:var(--mute);margin-top:4px}
.live{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mute);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb}.dot.on{background:#22b573;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,181,115,.2)}}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}*{transition:none!important}}
h1{font:800 clamp(34px,6vw,64px)/1 var(--display);letter-spacing:-.04em;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:32px}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-bottom:28px}
.step{background:var(--card);border-radius:22px;padding:20px;border-top:10px solid var(--c);display:flex;flex-direction:column;gap:4px;min-height:var(--h)}
.step.r1{--c:var(--gold);--h:290px;order:2}.step.r2{--c:var(--silver);--h:230px;order:1}.step.r3{--c:var(--bronze);--h:190px;order:3}
.medal{font:800 15px var(--display);color:var(--mute)}
.step .tn{font:800 clamp(22px,3vw,34px)/1.1 var(--display);letter-spacing:-.03em}
.step .cap{color:var(--mute);font-size:14px}
.step .pts{margin-top:auto;font:800 clamp(44px,7vw,84px)/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.step .pts span{font:600 14px var(--body);letter-spacing:0;color:var(--mute);margin-left:6px}
/* list */
.panel{background:var(--card);border-radius:22px;padding:8px 20px;margin-bottom:28px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.rk{font:800 24px var(--display);color:var(--mute)}
.row .tn{font:800 20px var(--display);letter-spacing:-.02em}
.row .cap{font-size:14px;color:var(--mute)}
.bar{height:8px;border-radius:8px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .8s}
.row .pts{font:800 30px var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--bg);border-radius:20px;padding:2px 10px;color:var(--mute)}
h2{font:800 24px var(--display);letter-spacing:-.03em;margin-bottom:12px}
.tw{overflow-x:auto;background:var(--card);border-radius:22px;padding:8px 12px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-weight:600}
th{font-weight:600;color:var(--mute);font-size:14px}
tr:last-child td{border:0}
td.best{font-weight:800;color:var(--blue)}
.empty{background:var(--card);border-radius:22px;padding:40px 24px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font:800 24px var(--display);margin-bottom:8px}
.empty code{background:var(--bg);padding:2px 8px;border-radius:6px}
/* admin */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:30px;padding:8px 18px;cursor:pointer;font-weight:600}
.tab[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.sc{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sc .tn{font:800 20px var(--display)}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button,.btn{min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;padding:0 12px}
.ctl button.p{background:var(--blue);border-color:var(--blue);color:#fff}
.ctl input{width:76px;height:44px;text-align:center;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:800 22px var(--display)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.del{color:#d32f4f}
.f{display:grid;gap:8px}
.f input{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.hint{color:var(--mute);font-size:14px;margin-bottom:12px}
.gate{max-width:340px;margin:12vh auto;text-align:center}
.gate .f{margin-top:16px}
@media(max-width:700px){
 .podium{grid-template-columns:1fr}
 .step.r1,.step.r2,.step.r3{order:0;min-height:0}.step.r1{order:-1}.step .pts{margin-top:10px}
 .row{grid-template-columns:34px 1fr auto}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ SETTINGS: paste your Google Apps Script web app URL ============ */
const CONFIG = { sheetURL: "https://script.google.com/macros/s/AKfycbymH7W6h2lz9QJoBVOh4HAf0IRw0e5CU604kVTt54XBfTLBY3rALzo-q-L_h9z9QjUD/exec" };
/* ============================================================================= */

let S = {teams:{},games:{},scores:{}};
let connected = false, tab = "score", gameSel = null, last = "", pending = 0, chain = Promise.resolve();
const live = !!CONFIG.sheetURL;
let pin = sessionStorage.getItem("pxPin") || "";
let unlocked = !live || sessionStorage.getItem("pxAdmin") === "1";
const $app = document.getElementById("app");
const isAdmin = () => location.hash === "#admin";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

/* ---------- storage layer: Google Sheet if configured, otherwise browser-only demo ---------- */
function applyLocal(path, val){
  const parts = path.split("/"); let o = S;
  parts.slice(0,-1).forEach(k => o = (o[k] = o[k] || {}));
  const k = parts[parts.length-1];
  val === null ? delete o[k] : o[k] = val;
}
function applyState(d){ S = {teams:d.teams||{}, games:d.games||{}, scores:d.scores||{}}; last = JSON.stringify(S); }
function setPath(path, val){
  applyLocal(path, val); render();
  if(!live){ localStorage.setItem("pxDemo", JSON.stringify(S)); return; }
  pending++;
  chain = chain.then(async () => {
    const r = await fetch(CONFIG.sheetURL, {method:"POST", body:JSON.stringify({path, val, pin})});
    const d = await r.json();
    if(d.error){ alert("Not saved: wrong PIN. Reload and unlock again."); return; }
    connected = true; if(pending <= 1) applyState(d);
  }).catch(() => { connected = false; }).finally(() => { pending--; render(); });
}
async function poll(){
  if(pending || document.hidden) return;
  const was = connected;
  try{
    const r = await fetch(CONFIG.sheetURL + "?t=" + Date.now());
    const d = await r.json(); connected = true;
    const j = JSON.stringify({teams:d.teams||{}, games:d.games||{}, scores:d.scores||{}});
    if(j !== last){ applyState(d); render(); } else if(was !== connected) render();
  }catch(e){ connected = false; if(was) render(); }
}
function start(){
  if(live){ render(); poll(); setInterval(poll, 3000); }
  else { try{ S = Object.assign({teams:{},games:{},scores:{}}, JSON.parse(localStorage.getItem("pxDemo")||"{}")); }catch(e){} render(); }
}

/* ---------- calculations ---------- */
function standings(){
  const gids = Object.keys(S.games);
  const list = Object.entries(S.teams).map(([id,t]) => {
    const per = gids.map(g => Number(S.scores[g]?.[id]) || 0);
    return {id, ...t, per, total: per.reduce((a,b)=>a+b,0)};
  }).sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
  list.forEach((t,i) => t.rank = i && t.total === list[i-1].total ? list[i-1].rank : i+1);
  return list;
}
const members = t => (t.members||"").split(",").map(s=>s.trim()).filter(Boolean);

/* ---------- dashboard ---------- */
function dashboard(){
  const L = standings(), gids = Object.keys(S.games), max = Math.max(1, ...L.map(t=>t.total));
  const medal = ["", "Champions", "Runner-up", "Second runner-up"];
  let h = `<header><div class="brand"><div class="mark">P</div><div>Paexskin<small>Office Games</small></div></div>
  <div class="live"><span class="dot ${(connected||!live)?"on":""}"></span>${live ? (connected?"Live":"Connecting…") : "Demo mode (this browser only)"}</div></header>
  <h1>Games Championship</h1><p class="sub">${gids.length} game${gids.length===1?"":"s"} played · ${L.length} team${L.length===1?"":"s"} competing</p>`;
  if(!L.length){
    h += `<div class="empty"><b>No teams yet</b>Open <code>${esc(location.href.split("#")[0])}#admin</code> on your phone to add teams, games and scores.</div>`;
    return h;
  }
  const top = L.filter(t=>t.rank<=3 && t.total>0).slice(0,3);
  if(top.length){
    h += `<div class="podium">` + top.map(t=>`<div class="step r${t.rank}"><div class="medal">${medal[t.rank]}</div>
      <div class="tn">${esc(t.name)}</div><div class="cap">Captain: ${esc(t.captain||"—")}</div>
      <div class="pts">${t.total}<span>pts</span></div></div>`).join("") + `</div>`;
  }
  const rest = L.filter(t => !top.includes(t));
  if(rest.length) h += `<div class="panel">` + rest.map(t=>`<div class="row"><div class="rk">${t.rank}</div>
    <div><div class="tn">${esc(t.name)}</div><div class="cap">Captain: ${esc(t.captain||"—")}</div>
    <div class="bar"><i style="width:${t.total/max*100}%"></i></div>
    <div class="chips">${members(t).map(m=>`<span class="chip">${esc(m)}</span>`).join("")}</div></div>
    <div class="pts">${t.total}</div></div>`).join("") + `</div>`;
  if(gids.length){
    h += `<h2>Scores by game</h2><div class="tw"><table><thead><tr><th>Team</th>${gids.map(g=>`<th>${esc(S.games[g].name)}</th>`).join("")}<th>Total</th></tr></thead><tbody>` +
    L.map(t=>`<tr><td>${esc(t.name)}</td>${t.per.map((p,i)=>{const best=Math.max(...L.map(x=>x.per[i]));return `<td class="${p>0&&p===best?"best":""}">${p}</td>`}).join("")}<td><b>${t.total}</b></td></tr>`).join("") + `</tbody></table></div>`;
  }
  return h;
}

/* ---------- admin (phone) ---------- */
function admin(){
  if(!unlocked) return `<div class="gate"><div class="mark" style="margin:0 auto 14px">P</div><h2>Score entry</h2><p class="hint">Enter the PIN to continue.</p>
    <div class="f"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn pri" onclick="unlock()">Unlock</button></div></div>`;
  const gids = Object.keys(S.games), tids = Object.keys(S.teams);
  if(!gameSel || !S.games[gameSel]) gameSel = gids[0] || null;
  let h = `<header><div class="brand"><div class="mark">P</div><div>Paexskin<small>Score entry</small></div></div><a class="btn" href="#" style="display:grid;place-items:center;text-decoration:none">View scoreboard</a></header>
  <div class="tabs">${[["score","Enter scores"],["teams","Teams"],["games","Games"]].map(([k,l])=>`<button class="tab" aria-pressed="${tab===k}" onclick="tab='${k}';render()">${l}</button>`).join("")}</div>`;
  if(tab==="score"){
    if(!gids.length || !tids.length) return h + `<div class="empty"><b>Set up first</b>Add at least one team and one game using the other tabs.</div>`;
    h += `<div class="tabs">${gids.map(g=>`<button class="tab" aria-pressed="${g===gameSel}" onclick="gameSel='${g}';render()">${esc(S.games[g].name)}</button>`).join("")}</div>
    <p class="hint">Points for this game. Changes show on the scoreboard instantly.</p>`;
    h += standings().sort((a,b)=>a.name.localeCompare(b.name)).map(t=>{const v=Number(S.scores[gameSel]?.[t.id])||0;
      return `<div class="card sc"><div><div class="tn">${esc(t.name)}</div><div class="hint" style="margin:0">Total ${t.total}</div></div>
      <div class="ctl"><button onclick="bump('${t.id}',-5)">−5</button><button onclick="bump('${t.id}',-1)">−1</button>
      <input type="number" inputmode="numeric" value="${v}" onchange="putScore('${t.id}',this.value)" aria-label="Score for ${esc(t.name)}">
      <button class="p" onclick="bump('${t.id}',1)">+1</button><button class="p" onclick="bump('${t.id}',5)">+5</button></div></div>`}).join("");
  }
  if(tab==="teams"){
    h += `<div class="card f"><b>Add a team</b><input id="tn" placeholder="Team name"><input id="tc" placeholder="Captain / leader"><input id="tm" placeholder="Members, separated by commas"><button class="btn pri" onclick="addTeam()">Add team</button></div>`;
    h += tids.map(id=>{const t=S.teams[id];return `<div class="card f"><input value="${esc(t.name)}" onchange="setPath('teams/${id}/name',this.value)" aria-label="Team name">
      <input value="${esc(t.captain)}" placeholder="Captain" onchange="setPath('teams/${id}/captain',this.value)" aria-label="Captain">
      <input value="${esc(t.members)}" placeholder="Members" onchange="setPath('teams/${id}/members',this.value)" aria-label="Members">
      <button class="btn del" onclick="delTeam('${id}')">Delete team</button></div>`}).join("");
  }
  if(tab==="games"){
    h += `<div class="card f"><b>Add a game</b><input id="gn" placeholder="Game name, e.g. Carrom"><button class="btn pri" onclick="addGame()">Add game</button></div>`;
    h += gids.map(id=>`<div class="card sc"><input style="flex:1;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px" value="${esc(S.games[id].name)}" onchange="setPath('games/${id}/name',this.value)" aria-label="Game name">
      <button class="btn del" onclick="delGame('${id}')">Delete</button></div>`).join("");
    if(gids.length) h += `<button class="btn del" style="width:100%;margin-top:12px" onclick="resetScores()">Reset all scores to zero</button>`;
  }
  return h;
}
async function unlock(){
  const v = document.getElementById("pin").value; document.activeElement.blur();
  try{
    const r = await fetch(CONFIG.sheetURL, {method:"POST", body:JSON.stringify({check:1, pin:v})});
    const d = await r.json();
    if(d.error) return alert("Wrong PIN. Try again.");
    pin = v; unlocked = true; sessionStorage.setItem("pxPin", v); sessionStorage.setItem("pxAdmin","1"); render();
  }catch(e){ alert("Could not reach the Google Sheet. Check the web app URL in index.html."); }
}
function putScore(t,v){ setPath(`scores/${gameSel}/${t}`, Math.round(Number(v)||0)); }
function bump(t,d){ putScore(t, (Number(S.scores[gameSel]?.[t])||0) + d); }
function addTeam(){ document.activeElement.blur(); const n=tn.value.trim(); if(!n) return alert("Enter a team name."); setPath("teams/"+uid("t"),{name:n,captain:tc.value.trim(),members:tm.value.trim()}); }
function addGame(){ document.activeElement.blur(); const n=gn.value.trim(); if(!n) return alert("Enter a game name."); setPath("games/"+uid("g"),{name:n}); }
function delTeam(id){ if(!confirm("Delete this team and its scores?")) return; setPath("teams/"+id,null); Object.keys(S.scores).forEach(g=>{ if(S.scores[g]?.[id]!==undefined) setPath(`scores/${g}/${id}`,null); }); }
function delGame(id){ if(confirm("Delete this game and its scores?")){ setPath("games/"+id,null); setPath("scores/"+id,null); } }
function resetScores(){ if(confirm("Set every score back to zero?")) setPath("scores",null); }

/* ---------- render ---------- */
function render(){
  if(isAdmin() && document.activeElement && document.activeElement.matches("#app .f input,#app .sc input")) return;
  $app.innerHTML = isAdmin() ? admin() : dashboard();
}
window.addEventListener("hashchange", () => { document.activeElement.blur(); render(); });
start();
</script>
</body>
</html>
